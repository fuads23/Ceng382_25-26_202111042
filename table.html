<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Table</title>
    <link rel="stylesheet" href="table_styles.css">
    <style>
        /* Input color */
        input {
            color: black !important; 
        }

        /* Buton text color */
        button {
            color: black !important;
        }

        /* Warning message */
        .warning {
            color: red;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: white;">Class Information</h2>
        
        <!-- Class Information -->
        <form id="classForm">
            <input type="text" id="className" placeholder="Class Name" required style="color: white;">
            <div id="classNameWarning" class="warning" style="display: none;">Min 3 characters</div>
            <input type="number" id="classSize" placeholder="Number of People" required style="color: white;">
            <input type="text" id="classDesc" placeholder="Description" required style="color: white;">
            <div id="classDescWarning" class="warning" style="display: none;">Min 3 characters</div>
            <button type="submit" style="background-color: yellow;">Add Class</button> 
        </form>

        <!-- Dynamic Table -->
        <table border="1" style="color: white; background-color: black;" id="classTable">
            <thead>
                <tr>
                    <th style="color: white;">Class Name</th>
                    <th style="color: white;">Number of People</th>
                    <th style="color: white;">Description</th>
                </tr>
            </thead>
            <tbody id="classTableBody">
                <!-- Inputted data will be added here -->
            </tbody>
        </table>
    </div>

    <script>
        // Function adds user class information dynamically
        document.getElementById("classForm").addEventListener("submit", function (event) {
            event.preventDefault(); // Page refresh blocking

            const className = document.getElementById("className").value.trim();
            const classSize = document.getElementById("classSize").value.trim();
            const classDesc = document.getElementById("classDesc").value.trim();

            // Min 3 character check
            if (className.length < 3 || classDesc.length < 3) {
                alert("Class Name and Description must be at least 3 characters long!");
                return; // If condition does not satisfy do not send form
            }

            if (className && classSize && classDesc) {
                const tableBody = document.getElementById("classTableBody");

                // Create new row
                const newRow = document.createElement("tr");
                newRow.innerHTML = `
                    <td style="color: white;">${className}</td>
                    <td style="color: white;">${classSize}</td>
                    <td style="color: white;">${classDesc}</td>
                `;

                // Click row
                newRow.addEventListener("click", function() {
                    console.log(`Clicked row: ${className} - ${classSize} - ${classDesc}`);
                });

                // Add table
                tableBody.appendChild(newRow);

                // Clean form
                document.getElementById("classForm").reset();
                document.getElementById("classNameWarning").style.display = "none"; // Hide warning after submission
                document.getElementById("classDescWarning").style.display = "none"; // Hide warning after submission
            } else {
                alert("Fill all the fields!");
            }
        });

        // Input Focus Event
        const inputs = document.querySelectorAll("input");
        inputs.forEach(input => {
            input.addEventListener("focus", function() {
                input.style.border = "4px solid black"; // Focus border color
            });
            input.addEventListener("blur", function() {
                input.style.border = ""; // When focus dissappear turn border initial state
            });
        });

        // Keyup Event: className and classDesc input fields min 3 character check
        document.getElementById("className").addEventListener("keyup", function() {
            const classNameWarning = document.getElementById("classNameWarning");
            if (this.value.length < 3) {
                classNameWarning.style.display = "block"; // If less than 3 character show warning message
            } else {
                classNameWarning.style.display = "none"; // If much than 3 character do not show warning
            }
        });

        document.getElementById("classDesc").addEventListener("keyup", function() {
            const classDescWarning = document.getElementById("classDescWarning");
            if (this.value.length < 3) {
                classDescWarning.style.display = "block"; // If less than 3 character show warning message
            } else {
                classDescWarning.style.display = "none"; // If much than 3 character do not show warning
            }
        });

        // Double-click Event: Deleting table row
        document.getElementById("classTableBody").addEventListener("dblclick", function(event) {
            if (event.target.tagName === "TD") { // If clicked table cell
                const row = event.target.parentElement; 
                row.remove(); 
                console.log("Row removed"); 
            }  
        });
    </script>
</body>
</html>
