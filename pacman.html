<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man</title>
    <link rel="stylesheet" href="pacman_helper.css">
</head>
<body>
    <div class="container">
        <input type="checkbox" id="startAnimation" hidden>

       
        <div class="pacman"></div>
        <div class="ghost blinky"></div>
        <div class="ghost pinky"></div>
        <div class="ghost inky"></div>
        <div class="ghost clyde"></div>

        
        <div class="pacman-login">
            <h2>Pac-Man Login</h2>
            <div id="liveClock">00:00:00</div>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">Login</button> <br>
            <label for="startAnimation" class="preview-btn">Preview</label>
        </div>
    </div>

    <script src="pacmann_helper.js"></script>
    <script>
        console.log("JS file loaded!");
    
        // Live clock
        function updateClock() {
            const clockElement = document.getElementById("liveClock");
            if (clockElement) {
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, "0");
                const minutes = now.getMinutes().toString().padStart(2, "0");
                const seconds = now.getSeconds().toString().padStart(2, "0");
                clockElement.textContent = `${hours}:${minutes}:${seconds}`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();
    
    </script>

</body>
</html>
